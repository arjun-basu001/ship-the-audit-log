name: smoke-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  run-examples:
    name: Run every example on ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Maturity ladder (workflow -> agent -> deep agent -> swarm sketch)
        run: python3 examples/01_maturity_ladder/run_all.py

      - name: Trust boundary (Agent Gateway demo)
        run: python3 examples/02_tool_gateway/demo.py

      - name: Precision-over-recall (disprove-it reviewer)
        run: python3 examples/03_disprove_it_eval/reviewer.py

      - name: Precision-over-recall (eval harness)
        run: python3 examples/03_disprove_it_eval/eval_harness.py
